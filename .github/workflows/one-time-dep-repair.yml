name: One-time dependency repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-dep-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'ci: run one-time dependency repair' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Update Next.js and repair dependency advisories
        run: |
          npm install next@16.4.3 eslint-config-next@16.4.3 --save-exact
          npm audit fix

      - name: Lint, type-check, tests, build, and audit
        run: |
          npm run lint
          npx tsc --noEmit
          npm test
          npm run build
          npm audit --audit-level=low

      - name: Commit verified dependency repair and remove this workflow
        run: |
          git rm .github/workflows/one-time-dep-repair.yml
          git add package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security: patch Next.js and audit dependencies"
          git push origin HEAD:main
